[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multidomain-article-discovery"
version = "0.1.0"
description = "A semantic article discovery and recommendation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "sentence-transformers>=5.7,<6",
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}